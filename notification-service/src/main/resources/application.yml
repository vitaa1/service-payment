server:
  port: 8080

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:notification_db}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Retry nativo com backoff exponencial; ao esgotar, rejeita (não recoloca na fila) —
        # o broker então dead-letra para a DLQ via o argumento da fila (ADR-0011).
        retry:
          enabled: true
          initial-interval: 500ms
          multiplier: 2
          max-attempts: 5
        default-requeue-rejected: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Endereços estáticos de envio (ADR-0011 — sem conceito de contato/cliente no domínio).
notification:
  from: no-reply@reconciliation.local
  to: ops@reconciliation.local
