server:
  port: 8080

spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ingestion_db}
    username: ${DB_USER:ingestion}
    password: ${DB_PASSWORD:ingestion}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Confirmação do broker: o relay só marca published_at após o ack (ADR-0006).
    publisher-confirm-type: correlated

# Defaults do Outbox relay (ADR-0006). Ajustáveis por ambiente.
ingestion:
  outbox:
    relay:
      interval-ms: 1000
      batch-size: 100
      max-attempts: 5
      confirm-timeout-ms: 5000
    purge:
      interval-ms: 86400000   # 1x/dia
      retention-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
